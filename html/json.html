<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>
    *{
        margin:0;
        padding:0;
    }
    .card{
        width:180px;
        height:100px;
        background-color: aliceblue;
        margin:auto;
        margin-top: 100px;
        border-radius:20px;
        padding:24px;
    }
</style>
<body style="background-color: rgb(206, 40, 40);">
    <center>
        <h1 style="color: rgb(239, 192, 244);">Online Shop</h1>


    <div class="card">
        <ul>
            <li><h3>Rice : 500</h3></li>
            <li><h3>Tea : 700</h3></li>
            <li><h3>Coffee : 800</h3></li>
            <li><h3>Sugar : 1000</h3></li>

        </ul>
    </div>
    <script>
        const product={
            Rice:500,
            Tea:700,
            Coffee:800,
            Sugar:1000,
        }

        let a = prompt("enter your product name==");
        let b = prompt("enter your quantity==");
        let c=product[a];
        document.write(c*b);
    </script> 
    </center>
</body>
</html>
